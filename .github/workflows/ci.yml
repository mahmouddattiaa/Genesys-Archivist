name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run schema:validate

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  # Fails the build if customer data or a capture bundle is ever committed.
  forbidden-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed customer artifacts
        run: |
          if git ls-files | grep -E '^(bundles|derived|documentation|spike-evidence)/' ; then
            echo "::error::Customer capture data must never be committed."
            exit 1
          fi
          if git ls-files | grep -E '\.(wav|mp3|ogg)$' ; then
            echo "::error::Audio assets must never be committed."
            exit 1
          fi
          echo "OK: no customer artifacts tracked."

  # A source package silently matched by a .gitignore rule is invisible to git
  # and absent from a fresh clone, while still building locally. That happened
  # once and went unnoticed across many commits.
  packages-tracked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every workspace package must have tracked files
        run: |
          fail=0
          for dir in packages/*/ apps/*/; do
            count=$(git ls-files "$dir" | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::$dir has NO tracked files - check .gitignore for an unanchored rule"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: all workspace packages are tracked."
          exit $fail
